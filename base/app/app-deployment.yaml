apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"postgresql"}]'
  labels:
    app: esdcghapp
    app.openshift.io/runtime: quarkus
    app.kubernetes.io/component: esdcghapp
    app.kubernetes.io/instance: esdcghapp
    app.kubernetes.io/part-of: esdcghapp
    backstage.io/kubernetes-id: esdcghapp
  name: esdcghapp
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: esdcghapp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: esdcghapp
        deployment: esdcghapp
        backstage.io/kubernetes-id: esdcghapp
    spec:
      containers:
        - image: esdcghapp:latest
          imagePullPolicy: Always
          name: esdcghapp
          env:
            - name: quarkus.datasource.username
              valueFrom:
                secretKeyRef:
                  key: database-user
                  name: postgresql
            - name: quarkus.datasource.password
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: postgresql
            - name: quarkus.datasource.jdbc.url
              valueFrom:
                secretKeyRef:
                  key: database-url
                  name: postgresql
          resources:
            limits:
              memory: 512Mi
              cpu: '1'
            requests:
              memory: 512Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          ports:
          - containerPort: 8080
            protocol: TCP
          - containerPort: 8443
            protocol: TCP
          - containerPort: 8778
            protocol: TCP
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccount: esdcghapp
      serviceAccountName: esdcghapp
      terminationGracePeriodSeconds: 30