apiVersion: v1
kind: Service
metadata:
  labels:
    app: esdcghapp-postgresql
    app.openshift.io/runtime: postgresql
    app.kubernetes.io/component: esdcghapp-postgresql
    app.kubernetes.io/instance: esdcghapp-postgresql
    app.kubernetes.io/part-of: esdcghapp
    backstage.io/kubernetes-id: esdcghapp
  name: postgresql-esdcghapp
spec:
  ports:
